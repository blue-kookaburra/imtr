name: Refresh disruption data

on:
  # Scheduled runs disabled 2026-08-10: transport.vic.gov.au now returns 403
  # to GitHub Actions' shared-runner IPs (Cloudflare IP-reputation block, not
  # the TLS-fingerprint issue this workflow was built to route around -- see
  # AGENTS.md). Scraping now runs from a local Windows Scheduled Task instead
  # (scripts/scrape-local.ps1 + scripts/register-scrape-task.ps1). Kept as
  # workflow_dispatch only in case the block ever lifts.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - run: npm test
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/disruptions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh disruption data"
            git push
          fi
