name: Refresh disruption data

on:
  schedule:
    - cron: "17 19 */2 * *" # every 2 days ~05:17 Melbourne time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - run: npm test
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/disruptions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh disruption data"
            git push
          fi
